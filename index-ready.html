<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hisab App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.header{position:sticky;top:0;z-index:20;background:#16a34a;color:#fff;padding:16px;box-shadow:0 2px 8px #0002}.header-row{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.sub{font-size:12px;opacity:.9}.container{width:100%;max-width:720px;margin:auto;padding:14px}.btn{padding:11px 14px;border-radius:10px;font-weight:700}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.blue{background:#2563eb;color:white}.gray{background:#e5e7eb;color:#111827}.add-btn{width:100%;padding:15px;font-size:16px;margin-bottom:12px}.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;background:#fff;outline:none;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.summary-box{background:#fff;border-radius:12px;padding:11px 5px;text-align:center;box-shadow:0 2px 7px #0000000c}.summary-label{font-size:11px;color:#6b7280}.summary-value{font-size:15px;font-weight:800;margin-top:4px}.credit{color:#16a34a}.debit{color:#dc2626}.party-card{background:#fff;border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0000000c}.party-row{display:flex;gap:10px;align-items:center}.party-info{flex:1;min-width:0;cursor:pointer}.party-name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.party-balance{font-size:14px;margin-top:5px;font-weight:700}.party-sub{color:#6b7280;font-size:12px;margin-top:4px}.party-actions{display:flex;gap:5px}.small{padding:8px 9px;font-size:12px;border-radius:8px}.empty{background:#fff;border-radius:15px;padding:35px 15px;text-align:center;color:#6b7280}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modal-box{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px}.modal-title{font-size:21px;font-weight:800;margin-bottom:16px}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:13px;outline:none;background:#fff}textarea{resize:vertical}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1;padding:13px;border-radius:10px;font-weight:700}.transaction{padding:13px 0;border-bottom:1px solid #eee}.transaction:last-child{border-bottom:0}.trans-row{display:flex;justify-content:space-between;gap:10px}.trans-type{font-weight:800;font-size:14px}.trans-amount{font-size:17px;font-weight:800}.trans-date{color:#6b7280;font-size:12px;margin-top:4px}.trans-note{color:#374151;font-size:13px;margin-top:5px}.trans-buttons{display:flex;gap:6px;margin-top:8px}.menu{position:relative}.menu-btn{background:#ffffff22;color:white;padding:9px 12px;border-radius:9px}.menu-box{position:absolute;right:0;top:43px;width:190px;background:#fff;border-radius:12px;box-shadow:0 5px 20px #0003;overflow:hidden;display:none}.menu-box.show{display:block}.menu-box button{width:100%;background:#fff;text-align:left;padding:13px;color:#111827}.menu-box button:hover{background:#f3f4f6}.footer{text-align:center;color:#9ca3af;font-size:12px;padding:20px}
</style>
</head>
<body>
<header class="header"><div class="header-row"><div><div class="logo">Hisab</div><div class="sub">Party Ledger</div></div><div class="menu"><button class="menu-btn" onclick="toggleMenu()">☰</button><div id="menuBox" class="menu-box"><button onclick="backupData()">⬇️ Backup Data</button><button onclick="document.getElementById('restoreFile').click()">⬆️ Restore Data</button><button onclick="deleteAllData()">🗑️ Delete All Data</button></div></div></div></header>
<input id="restoreFile" type="file" accept=".json" hidden>
<main class="container">
<button class="btn green add-btn" onclick="openPartyModal()">＋ Add New Party</button>
<input id="search" class="search" type="search" placeholder="🔍 Search party..." oninput="render()">
<div id="summary" class="summary"></div><div id="partyList"></div>
<div class="footer">Hisab App • Your data is stored on this device</div>
</main>

<div id="partyModal" class="modal"><div class="modal-box"><div id="partyTitle" class="modal-title">Add New Party</div><label>Party Name</label><input id="partyName" placeholder="Enter party name"><div class="modal-actions"><button class="gray" onclick="closePartyModal()">Cancel</button><button class="green" onclick="saveParty()">Save</button></div></div></div>

<div id="transactionModal" class="modal"><div class="modal-box"><div id="transactionTitle" class="modal-title">Add Transaction</div><label>Type</label><select id="transactionType"><option value="credit">Credit</option><option value="debit">Debit</option></select><label>Amount</label><input id="transactionAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Enter amount"><label>Date & Time</label><input id="transactionDate" type="datetime-local"><label>Note</label><textarea id="transactionNote" rows="3" placeholder="Optional note"></textarea><div class="modal-actions"><button class="gray" onclick="closeTransactionModal()">Cancel</button><button class="green" onclick="saveTransaction()">Save</button></div></div></div>

<div id="detailsModal" class="modal"><div class="modal-box"><div id="detailsTitle" class="modal-title">Party</div><div id="detailsSummary"></div><div id="transactions"></div><div class="modal-actions"><button class="gray" onclick="closeDetails()">Close</button><button class="green" onclick="addTransactionFromDetails()">＋ Add Amount</button></div></div></div>

<script>
const STORAGE_KEY="hisab_app_data_v1";let data=loadData(),editingPartyId=null,currentPartyId=null,editingTransactionId=null;
function loadData(){try{let s=localStorage.getItem(STORAGE_KEY);if(!s)return[];let p=JSON.parse(s);return Array.isArray(p)?p:[]}catch(e){return[]}}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function createId(){return Date.now().toString(36)+Math.random().toString(36).substring(2)}
function openPartyModal(id=null){editingPartyId=id;document.getElementById("partyTitle").textContent=id?"Edit Party":"Add New Party";document.getElementById("partyName").value=id?(data.find(p=>p.id===id)?.name||""):"";document.getElementById("partyModal").classList.add("show");setTimeout(()=>document.getElementById("partyName").focus(),100)}
function closePartyModal(){document.getElementById("partyModal").classList.remove("show");editingPartyId=null}
function saveParty(){let name=document.getElementById("partyName").value.trim();if(!name){alert("Party name enter karo.");return}if(editingPartyId){let p=data.find(p=>p.id===editingPartyId);if(p)p.name=name}else data.push({id:createId(),name,transactions:[]});saveData();closePartyModal();render()}
function deleteParty(id){let p=data.find(x=>x.id===id);if(!p)return;if(!confirm(`"${p.name}" ko delete karna hai?\n\nIs party ke saare transactions bhi delete ho jayenge.`))return;data=data.filter(x=>x.id!==id);if(currentPartyId===id)closeDetails();saveData();render()}
function getTotals(p){let credit=0,debit=0;(p.transactions||[]).forEach(t=>{let a=Number(t.amount)||0;if(t.type==="credit")credit+=a;else debit+=a});return{credit,debit,balance:credit-debit}}
function money(v){return Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){renderSummary();renderParties()}
function renderSummary(){let credit=0,debit=0;data.forEach(p=>{let t=getTotals(p);credit+=t.credit;debit+=t.debit});let b=credit-debit;document.getElementById("summary").innerHTML=`<div class="summary-box"><div class="summary-label">Total Credit</div><div class="summary-value credit">₹${money(credit)}</div></div><div class="summary-box"><div class="summary-label">Total Debit</div><div class="summary-value debit">₹${money(debit)}</div></div><div class="summary-box"><div class="summary-label">Balance</div><div class="summary-value ${b>=0?"credit":"debit"}">₹${money(Math.abs(b))}</div></div>`}
function renderParties(){let list=document.getElementById("partyList"),search=document.getElementById("search").value.trim().toLowerCase(),parties=data.filter(p=>p.name.toLowerCase().includes(search));if(!parties.length){list.innerHTML=`<div class="empty">${data.length?"Party nahi mili.":"Abhi koi party nahi hai.<br><br>＋ Add New Party par click karo."}</div>`;return}list.innerHTML=parties.map(p=>{let t=getTotals(p),text=t.balance>0?`Lena hai: ₹${money(t.balance)}`:t.balance<0?`Dena hai: ₹${money(Math.abs(t.balance))}`:"Balance: ₹0.00",cls=t.balance>0?"credit":t.balance<0?"debit":"";return `<div class="party-card"><div class="party-row"><div class="party-info" onclick="openDetails('${p.id}')"><div class="party-name">${escapeHtml(p.name)}</div><div class="party-balance ${cls}">${text}</div><div class="party-sub">Credit ₹${money(t.credit)} &nbsp;•&nbsp; Debit ₹${money(t.debit)}</div></div><div class="party-actions"><button class="btn green small" onclick="openTransactionModal('${p.id}')">＋</button><button class="btn blue small" onclick="openPartyModal('${p.id}')">Edit</button><button class="btn red small" onclick="deleteParty('${p.id}')">Delete</button></div></div></div>`}).join("")}
function openDetails(id){currentPartyId=id;renderDetails();document.getElementById("detailsModal").classList.add("show")}
function closeDetails(){document.getElementById("detailsModal").classList.remove("show");currentPartyId=null}
function renderDetails(){let p=data.find(x=>x.id===currentPartyId);if(!p)return;document.getElementById("detailsTitle").textContent=p.name;let t=getTotals(p);document.getElementById("detailsSummary").innerHTML=`<div class="summary"><div class="summary-box"><div class="summary-label">Credit</div><div class="summary-value credit">₹${money(t.credit)}</div></div><div class="summary-box"><div class="summary-label">Debit</div><div class="summary-value debit">₹${money(t.debit)}</div></div><div class="summary-box"><div class="summary-label">Balance</div><div class="summary-value ${t.balance>=0?"credit":"debit"}">₹${money(Math.abs(t.balance))}</div></div></div>`;let ts=[...(p.transactions||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)),box=document.getElementById("transactions");if(!ts.length){box.innerHTML=`<div class="empty">Abhi koi transaction nahi hai.</div>`;return}box.innerHTML=ts.map(x=>`<div class="transaction"><div class="trans-row"><div><div class="trans-type ${x.type==="credit"?"credit":"debit"}">${x.type==="credit"?"CREDIT":"DEBIT"}</div><div class="trans-date">${formatDate(x.date)}</div></div><div class="trans-amount ${x.type==="credit"?"credit":"debit"}">${x.type==="credit"?"+":"-"} ₹${money(x.amount)}</div></div>${x.note?`<div class="trans-note">${escapeHtml(x.note)}</div>`:""}<div class="trans-buttons"><button class="btn blue small" onclick="openTransactionModal('${p.id}','${x.id}')">Edit</button><button class="btn red small" onclick="deleteTransaction('${p.id}','${x.id}')">Delete</button></div></div>`).join("")}
function addTransactionFromDetails(){if(currentPartyId)openTransactionModal(currentPartyId)}
function openTransactionModal(pid,tid=null){currentPartyId=pid;editingTransactionId=tid;document.getElementById("transactionTitle").textContent=tid?"Edit Transaction":"Add Transaction";if(tid){let p=data.find(x=>x.id===pid),t=p?.transactions.find(x=>x.id===tid);if(!t)return;document.getElementById("transactionType").value=t.type;document.getElementById("transactionAmount").value=t.amount;document.getElementById("transactionDate").value=t.date;document.getElementById("transactionNote").value=t.note||""}else{document.getElementById("transactionType").value="credit";document.getElementById("transactionAmount").value="";document.getElementById("transactionDate").value=currentDateTime();document.getElementById("transactionNote").value=""}document.getElementById("transactionModal").classList.add("show")}
function closeTransactionModal(){document.getElementById("transactionModal").classList.remove("show");editingTransactionId=null}
function saveTransaction(){let p=data.find(x=>x.id===currentPartyId);if(!p)return;let type=document.getElementById("transactionType").value,amount=Number(document.getElementById("transactionAmount").value),date=document.getElementById("transactionDate").value,note=document.getElementById("transactionNote").value.trim();if(!amount||amount<=0){alert("Valid amount enter karo.");return}if(!date){alert("Date select karo.");return}if(editingTransactionId){let t=p.transactions.find(x=>x.id===editingTransactionId);if(t){t.type=type;t.amount=amount;t.date=date;t.note=note}}else p.transactions.push({id:createId(),type,amount,date,note});saveData();closeTransactionModal();render();if(document.getElementById("detailsModal").classList.contains("show"))renderDetails()}
function deleteTransaction(pid,tid){let p=data.find(x=>x.id===pid);if(!p)return;let t=p.transactions.find(x=>x.id===tid);if(!t)return;if(!confirm(`Transaction delete karna hai?\n\n${t.type.toUpperCase()}: ₹${money(t.amount)}`))return;p.transactions=p.transactions.filter(x=>x.id!==tid);saveData();render();renderDetails()}
function backupData(){let backup={app:"Hisab App",version:1,backupDate:new Date().toISOString(),data};let blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hisab-backup-"+fileDate()+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);closeMenu()}
document.getElementById("restoreFile").addEventListener("change",function(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(){try{let backup=JSON.parse(reader.result),restored=Array.isArray(backup)?backup:backup.data;if(!Array.isArray(restored))throw Error();if(!confirm("Current data replace ho jayega.\n\nBackup restore karna hai?"))return;data=restored;saveData();render();alert("Backup successfully restore ho gaya.")}catch(err){alert("Invalid backup file.")}};reader.readAsText(file);e.target.value="";closeMenu()});
function deleteAllData(){closeMenu();if(!data.length){alert("Delete karne ke liye koi data nahi hai.");return}if(!confirm("WARNING!\n\nSaari parties aur transactions permanently delete ho jayengi.\n\nContinue?"))return;data=[];saveData();render()}
function toggleMenu(){document.getElementById("menuBox").classList.toggle("show")}
function closeMenu(){document.getElementById("menuBox").classList.remove("show")}
document.addEventListener("click",e=>{if(!document.querySelector(".menu").contains(e.target))closeMenu()});
function currentDateTime(){let d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function formatDate(v){let d=new Date(v);if(isNaN(d.getTime()))return v||"";return d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fileDate(){let d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
render();
</script>
</body>
</html>
