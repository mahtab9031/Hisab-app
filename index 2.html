<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<title>Real Estate Investment Hisab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17202a}
header{background:#1769aa;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{opacity:.85;font-size:13px;margin-top:4px}
main{max-width:900px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
.stat{font-size:12px;color:#65717d}.num{font-size:20px;font-weight:700;margin-top:5px}
.invest{color:#1769aa}.income{color:#16803c}.expense{color:#c0392b}.profit{color:#8e44ad}
button{border:0;border-radius:9px;padding:10px 12px;font-weight:600;cursor:pointer}
.primary{background:#1769aa;color:#fff}.green{background:#16803c;color:#fff}.red{background:#c0392b;color:#fff}.gray{background:#e9eef3;color:#17202a}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}
label{font-size:13px;font-weight:600;display:block;margin:8px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;font-size:15px;background:#fff}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #e8edf2;text-align:left;vertical-align:top}th{background:#f7f9fb}
.badge{padding:4px 7px;border-radius:12px;font-size:11px;font-weight:700}.b-in{background:#e7f7ed;color:#16803c}.b-out{background:#fdebea;color:#c0392b}.b-buy{background:#e8f1fb;color:#1769aa}.b-sale{background:#f1e9fb;color:#8e44ad}
.search{margin-bottom:10px}
.empty{text-align:center;color:#71808f;padding:25px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.small{font-size:12px;color:#667}.profitBox{padding:12px;background:#faf6ff;border-radius:10px;margin-top:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}

@media print{
 body{background:#fff}
 header,main,.modal:not(#reportModal),#reportModal .actions{display:none!important}
 #reportModal{display:block!important;position:static;background:#fff}
 #reportModal .sheet{max-height:none;border-radius:0;padding:0;width:100%}
 #reportContent .grid{display:grid}
}
</style>
</head>
<body>
<header><h1>🏠 Real Estate Investment Hisab</h1><div class="sub">Investment • Paise ka len-den • Plot profit</div></header>
<main>
<section class="grid">
<div class="card"><div class="stat">Total Investment</div><div id="sInv" class="num invest">₹0</div></div>
<div class="card"><div class="stat">Total Income / Sale</div><div id="sIncome" class="num income">₹0</div></div>
<div class="card"><div class="stat">Total Expenses</div><div id="sExp" class="num expense">₹0</div></div>
<div class="card"><div class="stat">Net Profit</div><div id="sProfit" class="num profit">₹0</div></div>
</section>

<div class="card">
<div class="actions">
<button class="primary" onclick="openForm()">＋ Add Entry</button>
<button class="green" onclick="openReport()">📊 Total Report</button><button class="gray" onclick="backup()">Backup Data</button>
<button class="gray" onclick="document.getElementById('restore').click()">Restore</button>
<input id="restore" type="file" accept=".json" hidden onchange="restore(this)">
<button class="red" onclick="clearAll()">Delete All</button>
</div>
</div>

<div class="card">
<input class="search" id="search" placeholder="🔎 Plot / property / party search..." oninput="render()">
<div style="overflow:auto">
<table><thead><tr><th>Date</th><th>Property / Party</th><th>Type</th><th>Amount</th><th>Note</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody></table>
</div>
</div>
</main>

<div id="modal" class="modal">
<div class="sheet">
<div class="actions" style="justify-content:space-between"><h2 id="formTitle" style="margin:0">Add Entry</h2><button class="gray" onclick="closeForm()">✕</button></div>
<form id="form" onsubmit="saveEntry(event)">
<input id="eid" type="hidden">
<div class="formgrid">
<div><label>Date</label><input id="date" type="date" required></div>
<div><label>Property / Party Name</label><input id="name" placeholder="e.g. Green City Plot" required></div>
<div><label>Entry Type</label><select id="type">
<option value="investment">Investment / Purchase</option>
<option value="sale">Sale / Income</option>
<option value="expense">Expense</option>
<option value="receive">Money Received</option>
<option value="pay">Money Paid</option>
</select></div>
<div><label>Amount (₹)</label><input id="amount" type="number" min="0" step="0.01" required></div>
<div class="full"><label>Note</label><textarea id="note" rows="2" placeholder="Kis ka payment, plot cost, registry, broker, etc."></textarea></div>
</div>
<div class="profitBox"><b>Profit calculation:</b> Sale/Income − Investment − Expenses</div>
<br><button class="primary" style="width:100%">Save Entry</button>
</form>
</div></div>


<div id="reportModal" class="modal">
<div class="sheet">
<div class="actions" style="justify-content:space-between">
<h2 style="margin:0">📊 Total Report</h2>
<button class="gray" onclick="closeReport()">✕</button>
</div>
<div id="reportContent"></div>
<br>
<div class="actions">
<button class="primary" onclick="window.print()">🖨️ Print / Save PDF</button>
<button class="gray" onclick="closeReport()">Close</button>
</div>
</div>
</div>
<script>
const KEY="real_estate_hisab_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function openForm(id=null){
 document.getElementById("modal").classList.add("show");
 document.getElementById("form").reset(); document.getElementById("eid").value="";
 document.getElementById("date").value=new Date().toISOString().slice(0,10);
 document.getElementById("formTitle").textContent=id?"Edit Entry":"Add Entry";
 if(id){let x=data.find(a=>a.id===id);if(!x)return;
  eid.value=x.id;date.value=x.date;name.value=x.name;type.value=x.type;amount.value=x.amount;note.value=x.note||"";
 }
}
function closeForm(){document.getElementById("modal").classList.remove("show")}
function saveEntry(e){
 e.preventDefault();let id=document.getElementById("eid").value;
 let x={id:id||Date.now().toString(),date:date.value,name:name.value.trim(),type:type.value,amount:+amount.value,note:note.value.trim()};
 if(id){let i=data.findIndex(a=>a.id===id);data[i]=x}else data.push(x);
 save();closeForm();render();
}
function del(id){if(confirm("Ye entry delete kare?")){data=data.filter(x=>x.id!==id);save();render()}}
function totals(){
 let inv=data.filter(x=>x.type==="investment").reduce((a,x)=>a+x.amount,0);
 let income=data.filter(x=>x.type==="sale"||x.type==="receive").reduce((a,x)=>a+x.amount,0);
 let exp=data.filter(x=>x.type==="expense"||x.type==="pay").reduce((a,x)=>a+x.amount,0);
 return {inv,income,exp,profit:income-inv-exp}
}

function openReport(){
 let t=totals();
 let by={};
 data.forEach(x=>{if(!by[x.name])by[x.name]={inv:0,income:0,exp:0,net:0};
   if(x.type==="investment")by[x.name].inv+=x.amount;
   if(x.type==="sale"||x.type==="receive")by[x.name].income+=x.amount;
   if(x.type==="expense"||x.type==="pay")by[x.name].exp+=x.amount;
   by[x.name].net=by[x.name].income-by[x.name].inv-by[x.name].exp;
 });
 let rows2=Object.entries(by).sort((a,b)=>b[1].net-a[1].net).map(([n,v])=>
 `<tr><td><b>${esc(n)}</b></td><td>${money(v.inv)}</td><td>${money(v.income)}</td><td>${money(v.exp)}</td><td><b>${money(v.net)}</b></td></tr>`).join("");
 document.getElementById("reportContent").innerHTML=`
 <div class="grid">
  <div class="card"><div class="stat">Total Investment</div><div class="num invest">${money(t.inv)}</div></div>
  <div class="card"><div class="stat">Total Income / Sale</div><div class="num income">${money(t.income)}</div></div>
  <div class="card"><div class="stat">Total Expense</div><div class="num expense">${money(t.exp)}</div></div>
  <div class="card"><div class="stat">Net Profit / Loss</div><div class="num profit">${money(t.profit)}</div></div>
 </div>
 <div class="card">
 <b>Entry Summary</b>
 <p class="small">Total Entries: ${data.length}</p>
 <table><thead><tr><th>Property / Party</th><th>Investment</th><th>Income</th><th>Expense</th><th>Net Profit/Loss</th></tr></thead>
 <tbody>${rows2||'<tr><td colspan="5" class="empty">No entries</td></tr>'}</tbody></table>
 </div>`;
 document.getElementById("reportModal").classList.add("show");
}
function closeReport(){document.getElementById("reportModal").classList.remove("show")}

function render(){
 let t=totals();sInv.textContent=money(t.inv);sIncome.textContent=money(t.income);sExp.textContent=money(t.exp);sProfit.textContent=money(t.profit);
 let q=search.value.toLowerCase();let arr=data.filter(x=>(x.name+" "+x.note+" "+x.type).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
 rows.innerHTML=arr.length?arr.map(x=>{
 let labels={investment:["Investment / Purchase","b-buy"],sale:["Sale / Income","b-sale"],expense:["Expense","b-out"],receive:["Money Received","b-in"],pay:["Money Paid","b-out"]};
 let l=labels[x.type];
 return `<tr><td>${x.date}</td><td><b>${esc(x.name)}</b></td><td><span class="badge ${l[1]}">${l[0]}</span></td><td><b>${money(x.amount)}</b></td><td>${esc(x.note||"")}</td><td><div class="actions"><button class="gray" onclick="openForm('${x.id}')">Edit</button><button class="red" onclick="del('${x.id}')">Delete</button></div></td></tr>`
 }).join(""):`<tr><td colspan="6" class="empty">Abhi koi entry nahi hai. ＋ Add Entry se shuru karein.</td></tr>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function backup(){
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="real-estate-hisab-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function restore(inp){
 let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;save();render();alert("Data restore ho gaya.")}catch(e){alert("Backup file sahi nahi hai.")}};r.readAsText(f)
}
function clearAll(){if(confirm("Saara Real Estate Hisab delete ho jayega. Continue?")){data=[];save();render()}}
render();
</script>
</body>
</html>
